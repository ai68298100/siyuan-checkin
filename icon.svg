<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title description">
  <title id="title">小驴打卡</title>
  <desc id="description">层叠的打卡卡片上一个渐变对勾，右上角带一枚暖橙色的连续记录圆点。</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF0FE"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A93FF"/>
      <stop offset="1" stop-color="#5560E8"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB13D"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#3D47A8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="90" height="90" rx="22" fill="url(#bgGrad)" stroke="#E2E5FA" stroke-width="1.5"/>

  <rect x="27" y="21" width="42" height="50" rx="10" fill="#DEE2FD"/>
  <rect x="33" y="25" width="42" height="50" rx="10" fill="#C5CBFB"/>

  <g filter="url(#cardShadow)">
    <rect x="24" y="29" width="46" height="46" rx="12" fill="url(#cardGrad)"/>
  </g>

  <path d="M36.5 52.5 44.5 60.5 59.5 43.5" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="70" cy="29" r="7.5" fill="url(#dotGrad)" stroke="#FFFFFF" stroke-width="3"/>
</svg>
