    <circle cx="56" cy="45" r="4"/>
    <rect x="29" y="55" width="38" height="22" rx="11"/>
  </g>

  <path id="checkmark" d="m38.5 65 7 6 12-12" fill="none" stroke="#D8583F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5.5"/>
</svg>
