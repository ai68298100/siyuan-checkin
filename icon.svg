<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title description">
  <title id="title">Little Donkey Check-in</title>
  <desc id="description">A donkey face with a checkmark set in a warm red square.</desc>

  <rect id="brand-background" x="2" y="2" width="92" height="92" rx="22" fill="#D8583F"/>

  <g id="donkey" fill="#303236">
    <path id="left-ear" d="M42 33c-9-2-21-8-25-18-2-5 2-8 7-6 11 3 19 12 22 20Z"/>
    <path id="right-ear" d="M54 33c9-2 21-8 25-18 2-5-2-8-7-6-11 3-19 12-22 20Z"/>
    <path id="head" d="M48 24c12 0 21 8 22 20l1 15c1 14-9 23-23 23s-24-9-23-23l1-15c1-12 10-20 22-20Z"/>
  </g>

  <g id="inner-ears" fill="#F59B84">
